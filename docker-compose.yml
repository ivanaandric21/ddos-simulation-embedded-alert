networks:
  ddos-net:
    driver: bridge
services:
  victim:
    build: ./victim
    container_name: victim
    networks:
      - ddos-net
    ports:
      - "8080:80"
    mem_limit: 64m
    cpus: 0.1
  attacker:
    build: ./attack
    networks:
      - ddos-net
    profiles:
      - attack
    environment:
      - TARGET_IP=victim
      - TARGET_PORT=80
      - ATTACK_MODE=${ATTACK_MODE:-http}
      - DURATION=${DURATION:-30}
      - THREADS=${THREADS:-100}
      - SLOWLORIS_CONNS=${SLOWLORIS_CONNS:-200}
      - WAIT_FOR_VICTIM=10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - victim
  monitoring:
    build: ./monitoring
    container_name: monitoring
    networks:
      - ddos-net
    cap_add:
      - NET_RAW
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    depends_on:
      - victim
