<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Simulation</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0c0c;
            --surface: #161616;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-dim: #707070;
            --accent: #3b82f6;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #eab308;
            --radius: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        .indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
        .dot.active { background: var(--green); }

        .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }
        .card + .card { margin-top: 1rem; }
        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
            margin-top: 0.75rem;
        }
        label:first-of-type { margin-top: 0; }

        select, input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus, input:focus { border-color: var(--accent); }

        .btn-group { display: flex; gap: 8px; margin-top: 1.25rem; }
        button {
            flex: 1;
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.15s;
            background: var(--surface);
            color: var(--text);
        }
        button:hover { border-color: var(--text-dim); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

        .log-header { display: flex; justify-content: space-between; align-items: center; }
        .log-clear { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; border: none; background: none; padding: 0; }
        .log-clear:hover { color: var(--text); }

        #log-box {
            margin-top: 0.75rem;
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem;
            height: 480px;
            overflow-y: auto;
            font-family: var(--mono);
            font-size: 0.75rem;
            line-height: 1.6;
            color: #8b8b8b;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #log-box .log-attack { color: var(--green); }
        #log-box .log-ui { color: var(--accent); }
        #log-box .log-error { color: var(--red); }

        .stats { display: flex; gap: 1rem; margin-top: 1rem; }
        .stat {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .stat-value { font-size: 1.1rem; font-weight: 600; }
        .stat-label { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DDoS Simulation</h1>
            <div class="indicator">
                <span class="dot" id="dot-victim"></span>
                <span id="status-text">Victim offline</span>
            </div>
        </header>

        <div class="layout">
            <div>
                <div class="card">
                    <div class="card-title">Konfiguracija napada</div>

                    <label for="mode">Tip napada</label>
                    <select id="mode" onchange="updateFields()">
                        <option value="http">HTTP Flood</option>
                        <option value="syn">SYN Flood</option>
                        <option value="udp">UDP Flood</option>
                        <option value="icmp">ICMP Flood</option>
                        <option value="slowloris">Slowloris</option>
                        <option value="all">Vsi naenkrat</option>
                    </select>

                    <label for="duration">Trajanje (s)</label>
                    <input type="number" id="duration" value="30" min="5" max="300">

                    <label for="scale">Stevilo napadalcev</label>
                    <input type="number" id="scale" value="1" min="1" max="50">

                    <div id="field-threads">
                        <label for="threads">Niti (HTTP)</label>
                        <input type="number" id="threads" value="100" min="1" max="500">
                    </div>

                    <div id="field-conns" style="display:none">
                        <label for="conns">Povezave (Slowloris)</label>
                        <input type="number" id="conns" value="200" min="1" max="1000">
                    </div>

                    <div class="btn-group">
                        <button class="btn-primary" id="btn-start" onclick="startAttack()">Zazeni</button>
                        <button class="btn-danger" id="btn-stop" onclick="stopAttack()" disabled>Ustavi</button>
                    </div>

                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="attacker-count">0</div>
                            <div class="stat-label">Aktivni napadalci</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Infrastruktura</div>
                    <div class="btn-group">
                        <button class="btn-sm" onclick="infraAction('up')">Zazeni okolje</button>
                        <button class="btn-sm" onclick="infraAction('down')">Ustavi vse</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="log-header">
                    <div class="card-title" style="margin-bottom:0">Logi</div>
                    <button class="log-clear" onclick="clearLogs()">Pocisti</button>
                </div>
                <div id="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const dotVictim = document.getElementById('dot-victim');
        const statusText = document.getElementById('status-text');
        const attackerCount = document.getElementById('attacker-count');

        // Prikazemo dejansko samo tej input fielde kateri se lahko uporabijo za izbrane attack mode
        function updateFields() {
            const mode = document.getElementById('mode').value;
            document.getElementById('field-threads').style.display =
                (mode === 'http' || mode === 'all') ? 'block' : 'none';
            document.getElementById('field-conns').style.display =
                (mode === 'slowloris' || mode === 'all') ? 'block' : 'none';
        }
        updateFields();

        // SSE -> real time logs
        const sse = new EventSource('/logs');
        sse.onmessage = function(e) {
            const line = e.data;
            const span = document.createElement('span');
            if (line.includes('[attacker]')) {
                span.className = 'log-attack';
            } else if (line.startsWith('Zaganjam') || line.startsWith('Ustavljam') || line.startsWith('Victim') || line.startsWith('Napad')) {
                span.className = 'log-ui';
            } else if (line.toLowerCase().includes('error') || line.toLowerCase().includes('fail')) {
                span.className = 'log-error';
            }
            // Auto-scroll samo ce je uporabnik ze na dnu (tolerance 30px)
            const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 30;
            span.textContent = line + '\n';
            logBox.appendChild(span);
            if (atBottom) logBox.scrollTop = logBox.scrollHeight;
        };

        setInterval(checkStatus, 2000);
        checkStatus();

        function checkStatus() {
            fetch('/status').then(r => r.json()).then(data => {
                dotVictim.className = data.victim ? 'dot active' : 'dot';
                statusText.textContent = data.victim ? (data.running ? 'Napad aktiven' : 'Victim aktiven') : 'Victim offline';
                attackerCount.textContent = data.attackers;
                btnStart.disabled = data.running;
                btnStop.disabled = !data.running;
            }).catch(() => {});
        }

        function startAttack() {
            fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    mode: document.getElementById('mode').value,
                    duration: document.getElementById('duration').value,
                    threads: document.getElementById('threads').value,
                    conns: document.getElementById('conns').value,
                    scale: document.getElementById('scale').value,
                })
            }).then(r => r.json()).then(data => {
                if (data.error) alert(data.error);
                checkStatus();
            });
        }

        function stopAttack() {
            fetch('/stop', {method: 'POST'}).then(() => checkStatus());
        }

        function infraAction(action) {
            fetch('/infra', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action})
            }).then(() => setTimeout(checkStatus, 2000));
        }

        function clearLogs() {
            logBox.innerHTML = '';
        }
    </script>
</body>
</html>
