ServerName victim

# -----------------------------------------------------------------------------
# Apache tuning - hitri vodič (za DDoS lab)
#
# KEEP-ALIVE / POVEZAVE
# KeepAlive On|Off
#   - On: manj overhead-a za normalne uporabnike, ampak pri Slowloris tipih
#     napada lahko drži povezave odprte dlje časa.
#   - Off: varnejše za demo pod napadom, slabše za normalno UX/performanse.
#
# KeepAliveTimeout 1..10 (tipično)
#   - Nižje (1-2): bolje pod napadom, manj časa zasedeni workerji.
#   - Višje (5-10): bolje za normalen promet in počasne odjemalce.
#
# MaxKeepAliveRequests 50..500 (tipično)
#   - Koliko requestov dovoliš na eni keep-alive povezavi.
#   - Nižje vrednosti hitreje zapirajo povezave; višje zmanjšajo reconnect cost.
#
# PRIMERI (odkomentiraj po potrebi):
# KeepAlive On
# KeepAliveTimeout 2
# MaxKeepAliveRequests 100
# Najbolj robustna nastavitev za napad:
# KeepAlive Off
# Timeout 20
# -----------------------------------------------------------------------------

<IfModule mpm_prefork_module>
    # WORKERJI (prefork)
    # MaxRequestWorkers = glavni limit hkratnih requestov.
    #   - 20-40: hitro pokaže zasičenje (učni demo)
    #   - 80-200: bolj robustno, manj očiten padec
    # MaxRequestWorkers 35

    # Spodnje lahko dodaš, če želiš bolj natančen tuning.
    # StartServers 2
    # MinSpareServers 2
    # MaxSpareServers 5

    # MaxConnectionsPerChild
    #   - 0: procesi se ne reciklirajo (default)
    #   - 1000-10000: periodično recikliranje workerjev (stabilnost pri leakih)
    # MaxConnectionsPerChild 0

    # Najbolj robustna nastavitev za napad:
    # StartServers 5
    # MinSpareServers 5
    # MaxSpareServers 15
    # MaxRequestWorkers 150
    # MaxConnectionsPerChild 5000
    # Te nastavitve so za DDoS najbolj robustne, ker povečajo število razpoložljivih workerjev in rezervnih procesov za prometne sunke, 
    # hkrati pa z recikliranjem procesov ohranjajo stabilnost strežnika pri dolgotrajni obremenitvi.
</IfModule>

LogFormat "%h %l %u %t \"%r\" %>s %b %D" victim_timed
CustomLog /proc/self/fd/1 victim_timed
ErrorLog /proc/self/fd/2

ExtendedStatus On
<Location /server-status>
    SetHandler server-status
    Require all granted
</Location>
