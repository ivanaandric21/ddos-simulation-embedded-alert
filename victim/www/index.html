<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo storitve žrtve</title>
  <style>
    :root {
      --bg-a: #f7efe4;
      --bg-b: #dfeee6;
      --ink: #202020;
      --accent: #d5532a;
      --ok: #1d7f4e;
      --warn: #9c6700;
      --bad: #a61b29;
      --card: #fff9ef;
      --line: #d9c8aa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, var(--bg-a), transparent 45%),
                  radial-gradient(circle at 90% 90%, var(--bg-b), transparent 40%),
                  #f2f2ec;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .panel {
      width: min(820px, 100%);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h1 { margin-top: 0; font-size: 1.5rem; letter-spacing: 0.04em; }

    .status {
      margin: 0.8rem 0 1rem;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1rem;
    }

    .metric {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.65rem;
    }

    .metric small { display: block; opacity: 0.7; margin-bottom: 0.2rem; }
    .metric strong { font-size: 1.15rem; }

    .links a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 2px;
    }

    code {
      background: #f3ead9;
      border: 1px solid #d8c09d;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Žrtev napada(Apache)</h1>

    <div id="status" class="status">Zbiranje začetne osnove...</div>

    <section class="grid">
      <article class="metric"><small>Zadnja zahteva</small><strong id="lastMs">-</strong></article>
      <article class="metric"><small>Povprečje 10 zahtev</small><strong id="avgMs">-</strong></article>
      <article class="metric"><small>Zasedeni delavci</small><strong id="busy">-</strong></article>
      <article class="metric"><small>Zahtev/s (Apache)</small><strong id="rps">-</strong></article>
    </section>

    <p class="links">
      <a href="/server-status?auto" target="_blank" rel="noopener noreferrer">/server-status?auto</a>
    </p>
  </main>

  <script>
    const latencySamples = [];
    const maxSamples = 10;

    const statusEl = document.getElementById('status');
    const lastMsEl = document.getElementById('lastMs');
    const avgMsEl = document.getElementById('avgMs');
    const busyEl = document.getElementById('busy');
    const rpsEl = document.getElementById('rps');

    function average(values) {
      if (!values.length) return 0;
      return values.reduce((a, b) => a + b, 0) / values.length;
    }

    function classify(ms) {
      if (ms < 120) return { label: 'NORMALNO', color: '#1d7f4e' };
      if (ms < 450) return { label: 'OPOZORILO', color: '#9c6700' };
      return { label: 'NAPAD / PREOBREMENJENO', color: '#a61b29' };
    }

    async function probeHealth() {
      const start = performance.now();
      try {
        await fetch('/healthz?t=' + Date.now(), { cache: 'no-store' });
        const elapsed = performance.now() - start;

        latencySamples.push(elapsed);
        if (latencySamples.length > maxSamples) latencySamples.shift();

        const avg = average(latencySamples);
        const state = classify(avg);

        lastMsEl.textContent = elapsed.toFixed(0) + ' ms';
        avgMsEl.textContent = avg.toFixed(0) + ' ms';

        statusEl.textContent = state.label + ' ';
        statusEl.style.color = state.color;
        statusEl.style.borderColor = state.color;
      } catch (err) {
        statusEl.textContent = 'NEDOSEGLJIVO';
        statusEl.style.color = '#a61b29';
        statusEl.style.borderColor = '#a61b29';
      }
    }

    async function readServerStatus() {
      try {
        const res = await fetch('/server-status?auto', { cache: 'no-store' });
        const txt = await res.text();
        const lines = txt.split('\n');
        const map = {};
        lines.forEach((line) => {
          const idx = line.indexOf(':');
          if (idx > 0) {
            const key = line.slice(0, idx).trim();
            const value = line.slice(idx + 1).trim();
            map[key] = value;
          }
        });

        busyEl.textContent = map.BusyWorkers || '-';
        rpsEl.textContent = map.ReqPerSec ? Number(map.ReqPerSec).toFixed(2) : '-';
      } catch (err) {
        busyEl.textContent = '-';
        rpsEl.textContent = '-';
      }
    }

    async function tick() {
      await probeHealth();
      await readServerStatus();
    }

    tick();
    setInterval(tick, 1500);
  </script>
</body>
</html>
